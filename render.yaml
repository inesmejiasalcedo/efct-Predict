# Configuracion para desplegar en Render (render.com). Las keys se cargan en el panel.
services:
  - type: web
    name: efct-predict
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: efct-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://efct-predict.onrender.com

databases:
  - name: efct-db
    plan: free
